<div class="mb-4">
  <span class="ts-eyebrow">Panel de administración</span>
  <ul class="nav nav-pills ts-admin-nav mt-2 flex-nowrap overflow-auto">
    @for (s of secciones; track s.ruta) {
      <li class="nav-item">
        <a class="nav-link text-nowrap" [routerLink]="s.ruta" routerLinkActive="active">
          <i class="bi" [class]="s.icono"></i> {{ s.texto }}
        </a>
      </li>
    }
  </ul>
</div>
